<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Expedition · MW Photo Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#13282B; --bg2:#0E2023; --card:rgba(255,255,255,.035); --card-hover:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12); --fg:#F2EFE7; --muted:#A9B5B3; --gold:#E3A74A; --gold-soft:rgba(227,167,74,.14);
  --crit:#E8826A; --crit-soft:rgba(232,130,106,.12);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-head:"Montserrat","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg2);color:var(--fg);font:15px/1.55 var(--f-body);
  background-image:radial-gradient(1200px 700px at 80% -10%,#1C3A3D 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#173235 0,transparent 60%);
  background-attachment:fixed}
a{color:var(--gold)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 96px}
.brand{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.32em;color:var(--muted)}

/* hero */
.hero{padding:28px 0 36px;border-bottom:1px solid var(--line)}
.hello{color:var(--gold);font-weight:500}
.hero h1{font-family:var(--f-head);font-weight:600;font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0 10px;text-wrap:balance}
.hero .meta{color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

/* sections */
section{margin-top:48px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-title{display:flex;align-items:center;gap:14px}
.ico{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px}
h2{font-family:var(--f-head);font-weight:600;font-size:24px;margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{background:var(--card-hover)}
.btn svg{width:16px;height:16px}

/* days */
.days{display:flex;flex-direction:column;gap:10px}
.day{border:1px solid var(--line);border-radius:14px;background:var(--card)}
.day.last{border-color:rgba(227,167,74,.55)}
.day-sum{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:22px;width:100%;padding:14px 22px 14px 26px;border-radius:14px}
.day-sum:hover{background:var(--card-hover)}
.day-sum:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{display:flex;flex-direction:column;align-items:center;min-width:34px;font-variant-numeric:tabular-nums}
.num b{font-family:var(--f-head);color:var(--gold);font-size:19px;line-height:1.1}
.num small{font-size:12px;color:var(--muted)}
.num i{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:4px}
.day-body{flex:1;min-width:0}
.day-body h3{margin:0 0 2px;font-size:16px;font-weight:600}
.day-body p{margin:0;color:#D5D9D4;font-size:14px}
.chev{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .15s}
.day-sum[aria-expanded="true"] .chev{transform:rotate(90deg)}
.day-more{padding:0 26px 18px 82px;color:#D5D9D4;white-space:pre-line;font-size:14px;max-width:80ch}

/* flights */
.flights{border-top:1px solid var(--line)}
.flight{display:grid;grid-template-columns:76px 100px minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.f-date{color:var(--muted);font-size:14px}
.f-time{font-weight:600;font-size:17px}
.f-route{display:flex;align-items:center;gap:12px;font-family:var(--f-head);font-weight:600;letter-spacing:.16em}
.f-route svg{width:15px;height:15px;color:var(--gold)}
.f-route small{font-family:var(--f-body);letter-spacing:0;font-weight:400;font-size:12px;color:var(--muted)}
.f-tag{color:var(--gold);font-size:13px;text-align:end}
.callout{margin-top:22px;border-inline-start:2px solid var(--gold);padding:4px 0 4px 16px;color:#D5D9D4;max-width:62ch}

/* stays */
.stays{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.stay{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.stay h3{margin:0;font-size:16px;font-weight:600}
.stay .when{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.stay p{margin:4px 0 0;color:#D5D9D4;font-size:14px}
.empty{color:var(--muted);font-size:14px}

/* states */
.state{margin:12vh auto 0;max-width:460px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:34px 28px}
.state.crit{border-color:rgba(232,130,106,.45);background:var(--crit-soft)}
.state h1{font-family:var(--f-head);font-size:22px;margin:0 0 8px;font-weight:600}
.state p{margin:0;color:var(--muted)}
.skel{height:64px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--card),rgba(255,255,255,.08),var(--card));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
[hidden]{display:none!important}

@media (max-width:640px){
  .wrap{padding:28px 16px 80px}
  .day-sum{gap:14px;padding:14px 16px}
  .day-more{padding:0 16px 16px 64px}
  .flight{grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"d t g" "d r r";row-gap:4px}
  .f-date{grid-area:d;align-self:start;padding-top:3px}.f-time{grid-area:t}.f-tag{grid-area:g}.f-route{grid-area:r;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MW PHOTO TOURS</div>
  <div id="app" aria-live="polite">
    <div style="margin-top:48px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- config ---------- */
// The anon key is public by design. Data is protected by RLS: the key can only call get_trip(token).
var SUPABASE_URL = "https://psthjpdpunoelssjoyni.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzdGhqcGRwdW5vZWxzc2pveW5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTc3NzQsImV4cCI6MjEwNjE3Mzc3NH0.jdPrsYHal_J5vSmBx-LAJZrLVP8pgt1s-2HcLlcyx9k";

var app = document.getElementById("app");
var TRIP = null;

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pd(s){if(!s)return null;var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function dm(s,pad){var d=pd(s);if(!d)return"";var a=d.getDate(),b=d.getMonth()+1;return pad?String(a).padStart(2,"0")+"."+String(b).padStart(2,"0"):a+"."+b}
function longDate(s){var d=pd(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):""}

var I={
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'
};

/* ---------- data ---------- */
function token(){
  var q=new URLSearchParams(location.search).get("t");
  if(!q&&location.hash)q=new URLSearchParams(location.hash.slice(1)).get("t");
  return q&&q.trim();
}
async function getTrip(t){
  var r=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_trip",{
    method:"POST",
    headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_token:t})
  });
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

/* ---------- render ---------- */
function state(title,text,crit){
  app.innerHTML='<div class="state'+(crit?" crit":"")+'"><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p></div>';
}
function render(d){
  var ex=d.expedition||{},days=d.days||[],fl=d.flights||[],st=d.stays||[];
  document.title=(ex.title||"Your expedition")+" · MW Photo Tours";
  var h='<header class="hero">'+
    (d.traveler&&d.traveler.first_name?'<div class="hello">Hi '+esc(d.traveler.first_name)+',</div>':"")+
    '<h1>'+esc(ex.title)+'</h1><div class="meta">'+
      (ex.region?'<span>'+esc(ex.region)+'</span>':"")+
      (ex.start_date?'<span>'+esc(longDate(ex.start_date))+(ex.end_date?' – '+esc(longDate(ex.end_date)):"")+'</span>':"")+
    '</div></header>';

  h+='<section><div class="sec-head"><div class="sec-title"><span class="ico">'+I.map+'</span><h2>Day by day</h2></div></div>';
  h+=days.length?'<div class="days">'+days.map(function(x,i){
    var last=i===days.length-1,has=!!x.details;
    return '<div class="day'+(last?" last":"")+'">'+
      '<button type="button" class="day-sum" '+(has?'aria-expanded="false" aria-controls="dm'+i+'" data-i="'+i+'"':'tabindex="-1" style="cursor:default"')+'>'+
        '<span class="num"><b>'+String(x.day_number).padStart(2,"0")+'</b><small>'+esc(dm(x.day_date))+'</small><i></i></span>'+
        '<span class="day-body"><h3>'+esc(x.title)+'</h3>'+(x.summary?'<p>'+esc(x.summary)+'</p>':"")+'</span>'+(has?I.chev:"")+
      '</button>'+(has?'<div class="day-more" id="dm'+i+'" hidden>'+esc(x.details)+'</div>':"")+
    '</div>'}).join("")+'</div>':'<p class="empty">The day-by-day plan will appear here soon.</p>';
  h+='</section>';

  h+='<section><div class="sec-head"><div class="sec-title"><span class="ico">'+I.plane+'</span><h2>Flights</h2></div>'+
    (fl.length?'<button class="btn" type="button" id="ics">'+I.dl+'Add to calendar</button>':"")+'</div>';
  h+=fl.length?'<div class="flights">'+fl.map(function(f){
    return '<div class="flight"><span class="f-date">'+esc(dm(f.flight_date,true))+'</span>'+
      '<span class="f-time">'+esc(f.depart_time||f.time_label||"TBA")+'</span>'+
      '<span class="f-route">'+esc(f.origin)+' '+I.plane+' '+esc(f.destination)+(f.arrive_time?' <small>'+esc(f.arrive_time)+'</small>':"")+'</span>'+
      '<span class="f-tag">'+esc(f.flight_no||f.tag||"")+'</span></div>'}).join("")+'</div>':'<p class="empty">Flight details will appear here soon.</p>';
  if(ex.meeting_note)h+='<div class="callout">'+esc(ex.meeting_note)+'</div>';
  h+='</section>';

  h+='<section><div class="sec-head"><div class="sec-title"><span class="ico">'+I.bed+'</span><h2>Where we stay</h2></div></div>';
  h+=st.length?'<div class="stays">'+st.map(function(s){
    return '<div class="stay"><span class="when">'+esc(dm(s.check_in))+(s.check_out?' – '+esc(dm(s.check_out)):"")+'</span><h3>'+esc(s.name)+'</h3>'+
      (s.place?'<span class="empty">'+esc(s.place)+'</span>':"")+(s.notes?'<p>'+esc(s.notes)+'</p>':"")+
      (s.url&&/^https?:\/\//.test(s.url)?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">Website</a>':"")+'</div>'}).join("")+'</div>':'<p class="empty">Accommodation details will appear here soon.</p>';
  h+='</section>';
  app.innerHTML=h;
}

/* ---------- calendar (.ics) ---------- */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function ymd(s){return String(s).replace(/-/g,"")}
function hm(s){return String(s).replace(":","")+"00"}
function addMin(date,time,mins){var p=time.split(":"),d=pd(date);d.setHours(+p[0],+p[1]+mins);return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00"}
function downloadIcs(){
  var ex=TRIP.expedition||{},tz=ex.timezone||"UTC",stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MW Photo Tours//Expedition//EN","CALSCALE:GREGORIAN"];
  (TRIP.flights||[]).forEach(function(f,i){
    var title=(f.flight_no?f.flight_no+" ":"")+f.origin+" → "+f.destination;
    L.push("BEGIN:VEVENT","UID:"+ymd(f.flight_date)+"-"+i+"-"+f.origin+f.destination+"@mwphototours","DTSTAMP:"+stamp,"SUMMARY:"+icsEsc(title));
    if(f.depart_time){
      L.push("DTSTART;TZID="+tz+":"+ymd(f.flight_date)+"T"+hm(f.depart_time));
      var end=f.arrive_time&&f.arrive_time>f.depart_time?ymd(f.flight_date)+"T"+hm(f.arrive_time):addMin(f.flight_date,f.depart_time,120);
      L.push("DTEND;TZID="+tz+":"+end);
    }else{
      var n=pd(f.flight_date);n.setDate(n.getDate()+1);
      L.push("DTSTART;VALUE=DATE:"+ymd(f.flight_date),"DTEND;VALUE=DATE:"+n.getFullYear()+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0"));
      if(f.time_label)L.push("DESCRIPTION:"+icsEsc(f.time_label+" flight, exact time to follow"));
    }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  var blob=new Blob([L.join("\r\n")+"\r\n"],{type:"text/calendar"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=(ex.title||"expedition").replace(/[^\w]+/g,"-").toLowerCase()+"-flights.ics";
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest(".day-sum[data-i]");
  if(b){var o=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",String(o));document.getElementById("dm"+b.dataset.i).hidden=!o;return}
  if(e.target.closest("#ics"))downloadIcs();
});

/* ---------- boot ---------- */
(async function(){
  var t=token();
  if(!t){state("Open your personal link","This page shows your expedition when opened from the private link we sent you.");return}
  try{
    var d=await getTrip(t);
    if(d.status==="ok"){TRIP=d;render(d)}
    else if(d.status==="withdrawn")state("This traveler is no longer on the expedition.","If you think this is a mistake, please contact MW Photo Tours.",true);
    else if(d.status==="not_published")state("Almost ready","Your expedition page is being prepared. Please check back soon.");
    else state("Link not recognised","Please use the exact link we sent you, or contact MW Photo Tours.");
  }catch(err){
    state("We couldn't load your expedition","Please check your connection and refresh the page.",true);
  }
})();
})();
</script>
</body>
</html>
